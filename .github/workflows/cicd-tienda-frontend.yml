name: CI/CD Tienda Perritos - Frontend

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR (runner)
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build imagen Frontend y push a ECR  (con cache)
      run: |
        cd frontend
        aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REPO_URL_FRONTEND }}
        docker pull ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest || true

        # 1. Extraer de forma automática las IPs de tu archivo .env local
        VVENTAS=$(grep VITE_API_URL_VENTAS .env | cut -d '=' -f2)
        VDESPACHOS=$(grep VITE_API_URL_DESPACHOS .env | cut -d '=' -f2)

        # 2. Build inyectando las variables del .env dinámicamente
        docker build \
          --cache-from ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest \
          --build-arg VITE_API_URL_VENTAS="$VVENTAS" \
          --build-arg VITE_API_URL_DESPACHOS="$VDESPACHOS" \
          -t tienda-frontend .

        docker tag tienda-frontend:latest ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest
        docker push ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest

    - name: Desplegar Frontend vía Docker Compose en SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_FRONTEND_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar tienda-frontend desde ECR usando Compose" \
          --parameters '{"commands":[
            "set -e",
            "aws ecr get-login-password --region '${{ secrets.AWS_REGION }}' | docker login --username AWS --password-stdin '${{ secrets.ECR_REGISTRY }}'",
            "cd /home/ubuntu || cd /home/ec2-user || cd ~",
            "docker compose pull front-despacho || true",
            "docker compose up -d --build --force-recreate front-despacho || docker run -d --name tienda-frontend -p 80:80 '${{ secrets.ECR_REPO_URL_FRONTEND }}':latest"
          ]}' \
          --output text