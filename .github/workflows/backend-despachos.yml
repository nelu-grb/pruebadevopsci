name: CI/CD Tienda Perritos - Backend Despachos

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "backend-despachos/**" # Ejecutar solo si cambia despachos
  workflow_dispatch:

jobs:
  build-push-deploy-despachos:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build y Push con Cache (Despachos)
      run: |
        cd backend-despachos # Ajusta la ruta exacta a tu carpeta de Despachos si es diferente
        
        docker pull 481358287898.dkr.ecr.us-east-1.amazonaws.com/back-despachos:latest || true
        
        docker build \
          --cache-from 481358287898.dkr.ecr.us-east-1.amazonaws.com/back-despachos:latest \
          -t tienda-despachos .
          
        docker tag tienda-despachos:latest 481358287898.dkr.ecr.us-east-1.amazonaws.com/back-despachos:latest
        docker push 481358287898.dkr.ecr.us-east-1.amazonaws.com/back-despachos:latest

    - name: Desplegar Despachos vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar tienda-despachos desde ECR" \
          --parameters '{"commands":[
            "set -e",
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 481358287898.dkr.ecr.us-east-1.amazonaws.com",
            "docker pull 481358287898.dkr.ecr.us-east-1.amazonaws.com/back-despachos:latest",
            "docker stop tienda-despachos || true",
            "docker rm tienda-despachos || true",
            "docker run -d --name tienda-despachos -p 8082:8081 -e DB_ENDPOINT=172.31.27.171 -e DB_PORT=3306 -e DB_NAME=tienda_despachos_db -e DB_USERNAME=root -e DB_PASSWORD=root_password -v despachos_data:/app/data 481358287898.dkr.ecr.us-east-1.amazonaws.com/back-despachos:latest"
          ]}' \
          --output text
